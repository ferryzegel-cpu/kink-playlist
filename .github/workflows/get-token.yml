name: Get Spotify Token

on:
  workflow_dispatch:
    inputs:
      spotify_code:
        description: "Plak hier de code uit callback.html"
        required: true
        type: string
      redirect_uri:
        description: "Moet exact gelijk zijn aan de redirect URI in Spotify"
        required: true
        type: string

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for tokens
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_CODE: ${{ inputs.spotify_code }}
          SPOTIFY_REDIRECT_URI: ${{ inputs.redirect_uri }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import requests

          client_id = os.environ["SPOTIFY_CLIENT_ID"]
          client_secret = os.environ["SPOTIFY_CLIENT_SECRET"]
          code = os.environ["SPOTIFY_CODE"]
          redirect_uri = os.environ["SPOTIFY_REDIRECT_URI"]

          basic = base64.b64encode(f"{client_id}:{client_secret}".encode()).decode()

          resp = requests.post(
              "https://accounts.spotify.com/api/token",
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              data={
                  "grant_type": "authorization_code",
                  "code": code,
                  "redirect_uri": redirect_uri,
              },
              timeout=30,
          )
          print("HTTP status:", resp.status_code)
          print(resp.text)

          resp.raise_for_status()
          data = resp.json()

          print("\n--- COPY THIS REFRESH TOKEN ---\n")
          print(data["refresh_token"])
          print("\n--- END REFRESH TOKEN ---\n")
          PY
